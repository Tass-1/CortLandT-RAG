readme = "README.md"
authors = [
    { name = "Tass-1", email = "priyanshujoshi10000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "datetime>=6.0",
    "fastapi[standard]>=0.141.1",
    "fastembed>=0.8.0",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "motor>=3.7.1",
    "psycopg2-binary>=2.9.13",
    "pymongo>=4.18.1",
    "qdrant-client[fastembed]>=1.19.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
